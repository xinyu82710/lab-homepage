<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>曾也鲁课题组 | CAU</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif;}
body{
    color:#222;
    background:#fff;
    line-height:1.7;
}
.top-bar{
    width:100%;
    height:36px;
    background:#900;
}
.wrap{
    max-width:1200px;
    margin:0 auto;
    display:flex;
    min-height: calc(100vh - 36px);
}
.sidebar{
    width:240px;
    border-right:1px solid #eee;
    padding-top:20px;
}
.sidebar-item{
    display:block;
    width:100%;
    text-align:left;
    padding:12px 20px;
    font-size:16px;
    border:none;
    background:none;
    cursor:pointer;
    transition:0.2s;
}
.sidebar-item.active{
    background:#f0f0f0;
    color:#006699;
    font-weight:500;
}
.sidebar-item:hover{
    background:#f7f7f7;
}
.main{
    flex:1;
    padding:24px 32px;
    position:relative;
}
.lang-switch{
    position:absolute;
    top:16px;
    right:24px;
}
.lang-switch button{
    border:1px solid #900;
    background:#fff;
    color:#900;
    padding:4px 12px;
    border-radius:3px;
    cursor:pointer;
    margin-left:6px;
}
.lang-switch button.active{
    background:#900;
    color:#fff;
}
.tab-content{
    display:none;
    margin-top:40px;
}
.tab-content.active{
    display:block;
}
/* ========== 纵向个人卡片样式（和截图对齐） ========== */
.profile-wrap {
    display: flex;
    gap: 36px;
    align-items: flex-start;
    flex-wrap: wrap;
}
.profile-img-card {
    width: 260px;
    height: auto;
    flex-shrink: 0;
}
.profile-img {
    width: 100%;
    display: block;
}
.profile-text {
    padding-top: 8px;
}
.profile-name {
    font-size: 48px;
    font-weight: 700;
    color:#222;
    margin:0 0 8px 0;
}
.profile-title {
    font-size:20px;
    color:#444;
    margin-bottom:24px;
}
.profile-info-item{
    font-size:19px;
    margin-bottom:14px;
}
.profile-info-item b{
    color:#222;
}
.section h2{
    font-size:22px;
    color:#222;
    margin:32px 0 16px;
    padding-bottom:6px;
    border-bottom:2px solid #900;
    display:inline-block;
}
ul{padding-left:24px;}
li{margin-bottom:12px;font-size:16px;line-height:1.7;}
.research-item{margin-bottom:20px;}
.research-item strong{color:#900;font-size:17px;}
.paper-item{margin-bottom:14px;font-size:16px;}
.member-block{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:24px;
    margin-top:12px;
}
.member-card{
    padding:14px;border:1px solid #eee;border-radius:4px;
}
.member-card h4{color:#900;margin-bottom:6px;font-size:17px;}
.placeholder-text{
    color:#777;
    font-size:16px;
}
@media (max-width:768px) {
    .wrap{flex-direction:column;}
    .sidebar{width:100%;border-right:none;border-bottom:1px solid #eee;}
    .profile-wrap{flex-direction:column;gap:20px;}
    .profile-img-card{width:240px;}
    .profile-name{font-size:36px;}
}
</style>
</head>
<body>
<div class="top-bar"></div>
<div class="wrap">
    <div class="sidebar">
        <button class="sidebar-item active" data-tab="info">个人资料</button>
        <button class="sidebar-item" data-tab="research">研究领域</button>
        <button class="sidebar-item" data-tab="course">开授课程</button>
        <button class="sidebar-item" data-tab="project">科研项目</button>
        <button class="sidebar-item" data-tab="paper">论文</button>
        <button class="sidebar-item" data-tab="tech">科技成果</button>
        <button class="sidebar-item" data-tab="award">荣誉及奖励</button>
        <button class="sidebar-item" data-tab="admission">招生信息</button>
        <button class="sidebar-item" data-tab="team">团队展示</button>
        <button class="sidebar-item" data-tab="news">活动动态</button>
    </div>
    <div class="main">
        <div class="lang-switch">
            <button id="btnZh" class="active">中文</button>
            <button id="btnEn">English</button>
        </div>
        <div id="tab-info" class="tab-content active"></div>
        <div id="tab-research" class="tab-content"></div>
        <div id="tab-course" class="tab-content"></div>
        <div id="tab-project" class="tab-content"></div>
        <div id="tab-paper" class="tab-content"></div>
        <div id="tab-tech" class="tab-content"></div>
        <div id="tab-award" class="tab-content"></div>
        <div id="tab-admission" class="tab-content"></div>
        <div id="tab-team" class="tab-content"></div>
        <div id="tab-news" class="tab-content"></div>
    </div>
</div>

<script>
let data = null;
let currentLang = "zh";
fetch("data.json")
.then(res=>{
    if(!res.ok) throw new Error("data.json 加载失败，请检查文件名大小写！");
    return res.json();
})
.then(d=>{
    data = d;
    render();
})
.catch(err=>{
    console.error("加载错误：", err);
    alert("data.json加载失败：" + err.message);
})

document.getElementById("btnZh").onclick = ()=>{
    currentLang = "zh";
    document.getElementById("btnZh").classList.add("active");
    document.getElementById("btnEn").classList.remove("active");
    render();
}
document.getElementById("btnEn").onclick = ()=>{
    currentLang = "en";
    document.getElementById("btnEn").classList.add("active");
    document.getElementById("btnZh").classList.remove("active");
    render();
}

document.querySelectorAll(".sidebar-item").forEach(btn=>{
    btn.onclick = ()=>{
        document.querySelectorAll(".sidebar-item").forEach(b=>b.classList.remove("active"));
        document.querySelectorAll(".tab-content").forEach(c=>c.classList.remove("active"));
        btn.classList.add("active");
        const targetId = "tab-" + btn.dataset.tab;
        document.getElementById(targetId).classList.add("active");
    }
})

function render(){
    if(!data) return;
    const pi = data.pi[currentLang];
    const lang = currentLang;
    const menuText = {
        info: lang==="zh"?"个人资料":"Profile",
        research: lang==="zh"?"研究领域":"Research Interests",
        course: lang==="zh"?"开授课程":"Courses",
        project: lang==="zh"?"科研项目":"Research Projects",
        paper: lang==="zh"?"论文":"Publications",
        tech: lang==="zh"?"科技成果":"Patents & Works",
        award: lang==="zh"?"荣誉及奖励":"Awards",
        admission: lang==="zh"?"招生信息":"Admission",
        team: lang==="zh"?"团队展示":"Team Members",
        news: lang==="zh"?"活动动态":"News"
    };
    const btns = document.querySelectorAll(".sidebar-item");
    const keys = ["info","research","course","project","paper","tech","award","admission","team","news"];
    keys.forEach((k,i)=> btns[i].textContent = menuText[k]);

    // 纵向个人资料卡片（和截图样式对齐）
    let infoHtml = `
        <div class="profile-wrap">
            <div class="profile-img-card">
                <img class="profile-img" src="${data.pi.photo}" alt="${pi.name}"
                onerror="this.style.display='none';this.parentNode.innerHTML='<div style=color:#999;padding:20px;text-align:center>照片缺失</div>';">
            </div>
            <div class="profile-text">
                <h1 class="profile-name">${pi.name}</h1>
                <div class="profile-title">${pi.title}</div>
                <div class="profile-info-item"><b>Email：</b>${pi.email}</div>
                <div class="profile-info-item"><b>单位：</b>${pi.dept}</div>
                <div class="profile-info-item"><b>办公室：</b>${pi.office}</div>
            </div>
        </div>
        <div class="section">
            <h2>${lang==="zh"?"简介":"Biography"}</h2>
            <div style="font-size:16px;line-height:1.8;">${pi.bio}</div>
        </div>
        <div class="section">
            <h2>${lang==="zh"?"教育经历":"Education"}</h2>
            <ul>
    `;
    pi.edu.forEach(item=>infoHtml += `<li>${item.when} ${item.what}</li>`);
    infoHtml += `</ul></div>`;

    infoHtml += `<div class="section"><h2>${lang==="zh"?"工作经历":"Work Experience"}</h2><ul>`;
    pi.work.forEach(item=>infoHtml += `<li>${item.when} ${item.what}</li>`);
    infoHtml += `</ul></div>`;

    infoHtml += `<div class="section"><h2>${lang==="zh"?"学术兼职":"Academic Services"}</h2><ul>`;
    pi.society.forEach(item=>infoHtml += `<li>${item}</li>`);
    infoHtml += `</ul></div>`;
    document.getElementById("tab-info").innerHTML = infoHtml;

    //研究领域
    let resHtml = `<div class="section"><h2>${menuText.research}</h2>`;
    data.research[lang].forEach(r=>resHtml += `<div class="research-item"><strong>${r.title}</strong><br>${r.desc}</div>`);
    resHtml += `</div>`;
    document.getElementById("tab-research").innerHTML = resHtml;

    //开授课程
    let courseHtml = `<div class="section"><h2>${menuText.course}</h2><ul>`;
    data.courses[lang].forEach(c=>courseHtml += `<li>${c}</li>`);
    courseHtml += `</ul></div>`;
    document.getElementById("tab-course").innerHTML = courseHtml;

    //科研项目
    let proHtml = `<div class="section"><h2>${menuText.project}</h2><ul>`;
    data.projects[lang].forEach(p=>proHtml += `<li>${p}</li>`);
    proHtml += `</ul></div>`;
    document.getElementById("tab-project").innerHTML = proHtml;

    //论文
    let paperHtml = `<div class="section"><h2>${menuText.paper}</h2><ul>`;
    data.publications.highlights.forEach(p=>paperHtml += `<li class="paper-item">${p}</li>`);
    paperHtml += `</ul></div>`;
    document.getElementById("tab-paper").innerHTML = paperHtml;

    //科技成果（专利软著）
    let techHtml = `<div class="section"><h2>${menuText.tech}</h2><ul>`;
    data.ip[lang].forEach(i=>techHtml += `<li>${i}</li>`);
    techHtml += `</ul></div>`;
    document.getElementById("tab-tech").innerHTML = techHtml;

    //荣誉奖励
    let awardHtml = `<div class="section"><h2>${menuText.award}</h2><ul>`;
    data.awards[lang].forEach(a=>awardHtml += `<li>${a}</li>`);
    awardHtml += `</ul></div>`;
    document.getElementById("tab-award").innerHTML = awardHtml;

    //招生信息
    let admHtml = `<div class="section"><h2>${menuText.admission}</h2><div style="font-size:16px;line-height:1.8;">${data.join[lang]}</div></div>`;
    document.getElementById("tab-admission").innerHTML = admHtml;

    //团队展示
    let teamHtml = `<div class="section"><h2>${menuText.team}</h2>`;
    const m = data.members;
    const hasMember = (m.postdoc && m.postdoc.length>0) || (m.phd && m.phd.length>0) || (m.master && m.master.length>0) || (m.alumni && m.alumni.length>0);
    if(m.postdoc && m.postdoc.length>0){
        teamHtml += `<h3 style="margin:14px 0 8px;color:#333">${lang==="zh"?"博士后":"Postdocs"}</h3><div class="member-block">`;
        m.postdoc.forEach(x=>teamHtml += `<div class="member-card"><h4>${x.name}</h4><div>${x.info}</div></div>`);
        teamHtml += `</div>`;
    }
    if(m.phd && m.phd.length>0){
        teamHtml += `<h3 style="margin:14px 0 8px;color:#333">${lang==="zh"?"博士研究生":"PhD Students"}</h3><div class="member-block">`;
        m.phd.forEach(x=>teamHtml += `<div class="member-card"><h4>${x.name}</h4><div>${x.info}</div></div>`);
        teamHtml += `</div>`;
    }
    if(m.master && m.master.length>0){
        teamHtml += `<h3 style="margin:14px 0 8px;color:#333">${lang==="zh"?"硕士研究生":"Master Students"}</h3><div class="member-block">`;
        m.master.forEach(x=>teamHtml += `<div class="member-card"><h4>${x.name}</h4><div>${x.info}</div></div>`);
        teamHtml += `</div>`;
    }
    if(m.alumni && m.alumni.length>0){
        teamHtml += `<h3 style="margin:14px 0 8px;color:#333">${lang==="zh"?"毕业生":"Alumni"}</h3><div class="member-block">`;
        m.alumni.forEach(x=>teamHtml += `<div class="member-card"><h4>${x.name}</h4><div>${x.info}</div></div>`);
        teamHtml += `</div>`;
    }
    if(!hasMember) teamHtml += `<p class="placeholder-text">${lang==="zh"?"成员信息持续更新中":"Team members coming soon"}</p>`;
    teamHtml += `</div>`;
    document.getElementById("tab-team").innerHTML = teamHtml;

    //活动动态
    let newsHtml = `<div class="section"><h2>${menuText.news}</h2><ul>`;
    data.news[lang].forEach(n=>newsHtml += `<li>${n}</li>`);
    newsHtml += `</ul></div>`;
    document.getElementById("tab-news").innerHTML = newsHtml;
}
</script>
</body>
</html>
