<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>曾也鲁课题组 | CAU</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif;}
body{
    color:#222;
    background:#fff;
    line-height:1.7;
}
/* 顶部深红通栏，对标中农官网 */
.top-bar{
    width:100%;
    height:36px;
    background:#900;
}
.wrap{
    max-width:1200px;
    margin:0 auto;
    display:flex;
    min-height: calc(100vh - 36px);
}
/* 左侧侧边菜单 */
.sidebar{
    width:240px;
    border-right:1px solid #eee;
    padding-top:20px;
}
.sidebar-item{
    display:block;
    width:100%;
    text-align:left;
    padding:12px 20px;
    font-size:16px;
    border:none;
    background:none;
    cursor:pointer;
    transition:0.2s;
}
.sidebar-item.active{
    background:#f0f0f0;
    color:#006699;
    font-weight:500;
}
.sidebar-item:hover{
    background:#f7f7f7;
}
/* 右侧内容区 */
.main{
    flex:1;
    padding:24px 32px;
    position:relative;
}
.lang-switch{
    position:absolute;
    top:16px;
    right:24px;
}
.lang-switch button{
    border:1px solid #900;
    background:#fff;
    color:#900;
    padding:4px 12px;
    border-radius:3px;
    cursor:pointer;
    margin-left:6px;
}
.lang-switch button.active{
    background:#900;
    color:#fff;
}
.tab-content{
    display:none;
    margin-top:40px;
}
.tab-content.active{
    display:block;
}
/* 个人资料板块 */
.profile-wrap {
    display: flex;
    gap: 32px;
    flex-wrap: wrap;
    align-items: flex-start;
}
.profile-img-card {
    width: 220px;
    height: 290px;
    border-radius: 4px;
    border:1px solid #ddd;
    overflow: hidden;
    flex-shrink: 0;
}
.profile-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
.profile-text {
    flex: 1;
    min-width: 280px;
}
.profile-name {
    font-size: 34px;
    font-weight: 700;
    color:#222;
    margin:0 0 6px 0;
}
.profile-title {
    font-size:17px;
    color:#444;
    margin-bottom:16px;
}
.profile-info-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px 16px;
    font-size:15px;
}
.section h2{
    font-size:22px;
    color:#222;
    margin-bottom:16px;
    padding-bottom:6px;
    border-bottom:2px solid #900;
    display:inline-block;
}
ul{padding-left:22px;}
li{margin-bottom:10px;font-size:15.5px;}
.research-item{margin-bottom:16px;}
.research-item strong{color:#900;font-size:16px;}
.paper-item{margin-bottom:12px;font-size:15px;}
.member-block{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    gap:20px;
    margin-top:12px;
}
.member-card{
    padding:12px;border:1px solid #eee;border-radius:4px;
}
.member-card h4{color:#900;margin-bottom:4px;}
.placeholder-text{
    color:#777;
    font-size:15px;
}
@media (max-width:768px) {
    .wrap{flex-direction:column;}
    .sidebar{width:100%;border-right:none;border-bottom:1px solid #eee;}
    .profile-wrap{flex-direction:column;}
    .profile-img-card{max-width:240px;height:300px;}
}
</style>
</head>
<body>
<div class="top-bar"></div>
<div class="wrap">
    <!-- 左侧侧边菜单，顺序和截图完全一致 -->
    <div class="sidebar">
        <button class="sidebar-item active" data-tab="info">个人资料</button>
        <button class="sidebar-item" data-tab="overview">个人概况</button>
        <button class="sidebar-item" data-tab="research">研究领域</button>
        <button class="sidebar-item" data-tab="course">开授课程</button>
        <button class="sidebar-item" data-tab="project">科研项目</button>
        <button class="sidebar-item" data-tab="paper">论文</button>
        <button class="sidebar-item" data-tab="tech">科技成果</button>
        <button class="sidebar-item" data-tab="award">荣誉及奖励</button>
        <button class="sidebar-item" data-tab="admission">招生信息</button>
        <button class="sidebar-item" data-tab="team">团队展示</button>
        <button class="sidebar-item" data-tab="news">活动动态</button>
    </div>
    <!-- 右侧内容区 -->
    <div class="main">
        <div class="lang-switch">
            <button id="btnZh" class="active">中文</button>
            <button id="btnEn">English</button>
        </div>
        <div id="tab-info" class="tab-content active"></div>
        <div id="tab-overview" class="tab-content"></div>
        <div id="tab-research" class="tab-content"></div>
        <div id="tab-course" class="tab-content"></div>
        <div id="tab-project" class="tab-content"></div>
        <div id="tab-paper" class="tab-content"></div>
        <div id="tab-tech" class="tab-content"></div>
        <div id="tab-award" class="tab-content"></div>
        <div id="tab-admission" class="tab-content"></div>
        <div id="tab-team" class="tab-content"></div>
        <div id="tab-news" class="tab-content"></div>
    </div>
</div>

<script>
let data = null;
let currentLang = "zh";
fetch("data.json")
.then(res=>{
    if(!res.ok) throw new Error("data.json 加载失败");
    return res.json();
})
.then(d=>{
    data = d;
    render();
})
.catch(err=>{
    console.error("加载错误：", err);
    alert("data.json 加载失败：" + err.message);
})

// 语言切换
document.getElementById("btnZh").onclick = ()=>{
    currentLang = "zh";
    document.getElementById("btnZh").classList.add("active");
    document.getElementById("btnEn").classList.remove("active");
    render();
}
document.getElementById("btnEn").onclick = ()=>{
    currentLang = "en";
    document.getElementById("btnEn").classList.add("active");
    document.getElementById("btnZh").classList.remove("active");
    render();
}

// 侧边菜单点击
document.querySelectorAll(".sidebar-item").forEach(btn=>{
    btn.onclick = ()=>{
        document.querySelectorAll(".sidebar-item").forEach(b=>b.classList.remove("active"));
        document.querySelectorAll(".tab-content").forEach(c=>c.classList.remove("active"));
        btn.classList.add("active");
        const targetId = "tab-" + btn.dataset.tab;
        document.getElementById(targetId).classList.add("active");
    }
})

function render(){
    if(!data) return;
    const pi = data.pi[currentLang];
    const lang = currentLang;
    const menuText = {
        info: lang==="zh"?"个人资料":"Profile",
        overview: lang==="zh"?"个人概况":"Biography",
        research: lang==="zh"?"研究领域":"Research Interests",
        course: lang==="zh"?"开授课程":"Courses",
        project: lang==="zh"?"科研项目":"Research Projects",
        paper: lang==="zh"?"论文":"Publications",
        tech: lang==="zh"?"科技成果":"Patents & Works",
        award: lang==="zh"?"荣誉及奖励":"Awards",
        admission: lang==="zh"?"招生信息":"Admission",
        team: lang==="zh"?"团队展示":"Group Members",
        news: lang==="zh"?"活动动态":"News"
    };
    const btns = document.querySelectorAll(".sidebar-item");
    const keys = ["info","overview","research","course","project","paper","tech","award","admission","team","news"];
    keys.forEach((k,i)=>{
        btns[i].textContent = menuText[k];
    });

    // 1.个人资料
    document.getElementById("tab-info").innerHTML = `
        <div class="profile-wrap">
            <div class="profile-img-card">
                <img class="profile-img" src="${data.pi.photo}" alt="${pi.name}"
                onerror="this.style.display='none';this.parentNode.innerHTML='<div style=color:#999;padding:20px;text-align:center>PI photo</div>';">
            </div>
            <div class="profile-text">
                <h1 class="profile-name">${pi.name}</h1>
                <div class="profile-title">${pi.title}</div>
                <div class="profile-info-grid">
                    <div><b>Email：</b>${pi.email}</div>
                    <div><b>${lang==='zh'?'办公室':'Office'}：</b>${pi.office}</div>
                    <div><b>${lang==='zh'?'单位':'Affiliation'}：</b>${pi.dept}</div>
                </div>
            </div>
        </div>
    `;

    // 2.个人概况
    let overviewHtml = `<div class="section"><h2>${menuText.overview}</h2><div style="font-size:15.5px;line-height:1.8;">${pi.bio}</div></div>`;
    overviewHtml += `<div class="section"><h2>${lang==="zh"?"教育经历":"Education"}</h2><ul>`;
    pi.edu.forEach(item=>overviewHtml += `<li>${item.when} ${item.what}</li>`);
    overviewHtml += `</ul></div>`;
    overviewHtml += `<div class="section"><h2>${lang==="zh"?"工作经历":"Work Experience"}</h2><ul>`;
    pi.work.forEach(item=>overviewHtml += `<li>${item.when} ${item.what}</li>`);
    overviewHtml += `</ul></div>`;
    overviewHtml += `<div class="section"><h2>${lang==="zh"?"学术兼职":"Academic Services"}</h2><ul>`;
    pi.society.forEach(item=>overviewHtml += `<li>${item}</li>`);
    overviewHtml += `</ul></div>`;
    document.getElementById("tab-overview").innerHTML = overviewHtml;

    //3.研究领域
    let resHtml = `<div class="section"><h2>${menuText.research}</h2>`;
    data.research[lang].forEach(r=>resHtml += `<div class="research-item"><strong>${r.title}</strong><br>${r.desc}</div>`);
    resHtml += `</div>`;
    document.getElementById("tab-research").innerHTML = resHtml;

    //4.开授课程
    document.getElementById("tab-course").innerHTML = `<div class="section"><h2>${menuText.course}</h2><p class="placeholder-text">${lang==="zh"?"课程信息持续更新中...":"Course information coming soon..."}</p></div>`;

    //5.科研项目
    let proHtml = `<div class="section"><h2>${menuText.project}</h2><ul>`;
    data.projects[lang].forEach(p=>proHtml += `<li>${p}</li>`);
    proHtml += `</ul></div>`;
    document.getElementById("tab-project").innerHTML = proHtml;

    //6.论文
    let paperHtml = `<div class="section"><h2>${menuText.paper}</h2><ul>`;
    data.publications.highlights.forEach(p=>paperHtml += `<li class="paper-item">${p}</li>`);
    paperHtml += `</ul></div>`;
    document.getElementById("tab-paper").innerHTML = paperHtml;

    //7.科技成果
    let techHtml = `<div class="section"><h2>${menuText.tech}</h2><ul>`;
    data.ip[lang].forEach(i=>techHtml += `<li>${i}</li>`);
    techHtml += `</ul></div>`;
    document.getElementById("tab-tech").innerHTML = techHtml;

    //8.荣誉及奖励
    let awardHtml = `<div class="section"><h2>${menuText.award}</h2><ul>`;
    data.awards[lang].forEach(a=>awardHtml += `<li>${a}</li>`);
    awardHtml += `</ul></div>`;
    document.getElementById("tab-award").innerHTML = awardHtml;

    //9.招生信息
    let admHtml = `<div class="section"><h2>${menuText.admission}</h2><div style="font-size:15.5px;line-height:1.8;">${data.join[lang]}</div></div>`;
    document.getElementById("tab-admission").innerHTML = admHtml;

    //10.团队展示
    let teamHtml = `<div class="section"><h2>${menuText.team}</h2>`;
    const m = data.members;
    const hasMember = (m.postdoc && m.postdoc.length>0) || (m.phd && m.phd.length>0) || (m.master && m.master.length>0) || (m.alumni && m.alumni.length>0);
    if(m.postdoc && m.postdoc.length>0){
        teamHtml += `<h3 style="margin:12px 0 8px;color:#333">${lang==="zh"?"博士后":"Postdocs"}</h3><div class="member-block">`;
        m.postdoc.forEach(x=>teamHtml += `<div class="member-card"><h4>${x.name}</h4><div>${x.info}</div></div>`);
        teamHtml += `</div>`;
    }
    if(m.phd && m.phd.length>0){
        teamHtml += `<h3 style="margin:12px 0 8px;color:#333">${lang==="zh"?"博士研究生":"PhD Students"}</h3><div class="member-block">`;
        m.phd.forEach(x=>teamHtml += `<div class="member-card"><h4>${x.name}</h4><div>${x.info}</div></div>`);
        teamHtml += `</div>`;
    }
    if(m.master && m.master.length>0){
        teamHtml += `<h3 style="margin:12px 0 8px;color:#333">${lang==="zh"?"硕士研究生":"Master Students"}</h3><div class="member-block">`;
        m.master.forEach(x=>teamHtml += `<div class="member-card"><h4>${x.name}</h4><div>${x.info}</div></div>`);
        teamHtml += `</div>`;
    }
    if(m.alumni && m.alumni.length>0){
        teamHtml += `<h3 style="margin:12px 0 8px;color:#333">${lang==="zh"?"毕业生":"Alumni"}</h3><div class="member-block">`;
        m.alumni.forEach(x=>teamHtml += `<div class="member-card"><h4>${x.name}</h4><div>${x.info}</div></div>`);
        teamHtml += `</div>`;
    }
    if(!hasMember) teamHtml += `<p class="placeholder-text">${lang==="zh"?"成员信息持续更新中":"Members coming soon..."}</p>`;
    teamHtml += `</div>`;
    document.getElementById("tab-team").innerHTML = teamHtml;

    //11.活动动态
    document.getElementById("tab-news").innerHTML = `<div class="section"><h2>${menuText.news}</h2><p class="placeholder-text">${lang==="zh"?"课题组活动动态持续更新...":"Group news coming soon..."}</p></div>`;
}
</script>
</body>
</html>
