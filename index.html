<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>曾也鲁课题组 | CAU</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif;}
body{
    max-width:1100px;
    margin:0 auto;
    padding:24px 20px;
    color:#222;
    background:#fff;
    line-height:1.7;
}

/* 顶部标题栏 */
.site-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-bottom:16px;
    border-bottom:2px solid #1a365d;
    margin-bottom:0;
    flex-wrap:wrap;
    gap:12px;
}
.site-title{
    font-size:26px;
    font-weight:700;
    color:#1a365d;
}
.lang-switch button{
    border:1px solid #1a365d;
    background:#fff;
    color:#1a365d;
    padding:5px 14px;
    border-radius:4px;
    cursor:pointer;
    font-size:14px;
    margin-left:6px;
}
.lang-switch button.active{
    background:#1a365d;
    color:#fff;
}

/* 导航标签栏 */
.tab-nav{
    display:flex;
    border-bottom:1px solid #e5e7eb;
    margin-bottom:28px;
    flex-wrap:wrap;
}
.tab-btn{
    padding:12px 20px;
    background:none;
    border:none;
    cursor:pointer;
    font-size:16px;
    color:#555;
    border-bottom:3px solid transparent;
    margin-bottom:-1px;
    transition:all 0.2s;
}
.tab-btn:hover{
    color:#1a365d;
}
.tab-btn.active{
    color:#1a365d;
    font-weight:600;
    border-bottom-color:#1a365d;
}

/* 内容区 */
.tab-content{
    display:none;
}
.tab-content.active{
    display:block;
}

/* 首页profile */
.profile-wrap {
    display: flex;
    gap: 32px;
    padding: 10px 0 24px 0;
    flex-wrap: wrap;
    align-items: flex-start;
}
.profile-img-card {
    width: 220px;
    height: 290px;
    border-radius: 6px;
    border: 1px solid #e5e7eb;
    background: #f7f8fa;
    overflow: hidden;
    flex-shrink: 0;
}
.profile-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
.profile-text {
    flex: 1;
    min-width: 280px;
}
.profile-name {
    font-size: 38px;
    font-weight: 700;
    color: #1a365d;
    margin: 0 0 4px 0;
}
.profile-name-en {
    font-size: 20px;
    color: #6b7280;
    margin: 0 0 10px 0;
}
.profile-title {
    font-size: 18px;
    color: #333;
    margin: 0 0 16px 0;
}
.profile-desc {
    font-size: 16px;
    line-height: 1.8;
    color: #333;
    margin-bottom: 20px;
}
.profile-bio{
    font-size:15px;
    color:#444;
    line-height:1.8;
    margin-bottom:20px;
}
.profile-info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 20px;
    font-size: 15px;
}
.profile-info-grid span.label {
    color: #555;
    font-weight: 500;
    display: inline-block;
    min-width: 60px;
}

/* 通用板块 */
.section{
    margin-bottom:28px;
}
.section:last-child{margin-bottom:0;}
.section h2{
    color:#1a365d;
    font-size:22px;
    margin-bottom:14px;
    padding-bottom:6px;
    border-bottom:2px solid #1a365d;
    display:inline-block;
}
ul{padding-left:22px;}
li{margin-bottom:10px;font-size:15.5px;}
.research-item{
    margin-bottom:16px;
}
.research-item strong{
    color:#1a365d;
    font-size:16.5px;
}
.paper-item{margin-bottom:12px;font-size:15px;}
.member-block{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:20px;
    margin-top:12px;
}
.member-card{
    padding:14px;border:1px solid #eee;border-radius:6px;
}
.member-card h4{color:#1a365d;margin-bottom:4px;}

@media (max-width:768px) {
    .profile-wrap {
        flex-direction: column;
    }
    .profile-img-card {
        width: 100%;
        max-width: 260px;
        height: 340px;
    }
    .profile-info-grid {
        grid-template-columns: 1fr;
    }
    .tab-btn{
        padding:10px 14px;
        font-size:14px;
    }
}
</style>
</head>
<body>

<!-- 顶部标题 -->
<div class="site-header">
    <div class="site-title">ZENG Lab · 曾也鲁课题组</div>
    <div class="lang-switch">
        <button id="btnZh" class="active">中文</button>
        <button id="btnEn">English</button>
    </div>
</div>

<!-- 导航标签 -->
<div class="tab-nav" id="tabNav">
    <button class="tab-btn active" data-tab="home">首页</button>
    <button class="tab-btn" data-tab="edu">教育与工作</button>
    <button class="tab-btn" data-tab="research">研究方向</button>
    <button class="tab-btn" data-tab="pub">论文与项目</button>
    <button class="tab-btn" data-tab="award">获奖成果</button>
    <button class="tab-btn" data-tab="join">招生加入</button>
</div>

<!-- 各标签内容 -->
<div id="tab-home" class="tab-content active"></div>
<div id="tab-edu" class="tab-content"></div>
<div id="tab-research" class="tab-content"></div>
<div id="tab-pub" class="tab-content"></div>
<div id="tab-award" class="tab-content"></div>
<div id="tab-join" class="tab-content"></div>

<script>
let data = null;
let currentLang = "zh";

fetch("data.json")
.then(res=>{
    if(!res.ok) throw new Error("data.json 加载失败，状态码：" + res.status);
    return res.json();
})
.then(d=>{ data = d; render(); })
.catch(err=>{ alert("数据加载失败：" + err.message); console.error(err); });

// 语言切换
document.getElementById("btnZh").onclick = ()=>{
    currentLang = "zh";
    document.getElementById("btnZh").classList.add("active");
    document.getElementById("btnEn").classList.remove("active");
    render();
}
document.getElementById("btnEn").onclick = ()=>{
    currentLang = "en";
    document.getElementById("btnEn").classList.add("active");
    document.getElementById("btnZh").classList.remove("active");
    render();
}

// 标签切换
document.querySelectorAll(".tab-btn").forEach(btn=>{
    btn.onclick = ()=>{
        document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
        document.querySelectorAll(".tab-content").forEach(c=>c.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
    }
});

function render(){
    if(!data) return;
    const pi = data.pi[currentLang];
    const lang = currentLang;
    const t = {
        home: lang==="zh"?"首页":"Home",
        edu: lang==="zh"?"教育与工作":"Education & Work",
        research: lang==="zh"?"研究方向":"Research",
        pub: lang==="zh"?"论文与项目":"Publications & Projects",
        award: lang==="zh"?"获奖成果":"Awards & Patents",
        join: lang==="zh"?"招生加入":"Join Us"
    };

    // 更新导航文字
    const navBtns = document.querySelectorAll(".tab-btn");
    navBtns[0].textContent = t.home;
    navBtns[1].textContent = t.edu;
    navBtns[2].textContent = t.research;
    navBtns[3].textContent = t.pub;
    navBtns[4].textContent = t.award;
    navBtns[5].textContent = t.join;

    // ===== 首页 =====
    document.getElementById("tab-home").innerHTML = `
        <div class="profile-wrap">
            <div class="profile-img-card">
                <img class="profile-img" src="${data.pi.photo}" alt="${pi.name}"
                onerror="this.style.display='none';this.parentNode.innerHTML='<div style=\\'color:#999;padding:20px;text-align:center\\'>PI photo</div>';">
            </div>
            <div class="profile-text">
                <h1 class="profile-name">${pi.name}</h1>
                <div class="profile-name-en">${pi.nameEn}</div>
                <div class="profile-title">${pi.title}</div>
                <div class="profile-desc">${pi.tagline}</div>
                <div class="profile-bio">${pi.bio}</div>
                <div class="profile-info-grid">
                    <div><span class="label">Email</span> ${pi.email}</div>
                    <div><span class="label">${lang==='zh'?'办公室':'Office'}</span> ${pi.office}</div>
                    <div><span class="label">${lang==='zh'?'单位':'Dept'}</span> ${pi.dept}</div>
                </div>
            </div>
        </div>
    `;

    // ===== 教育与工作 =====
    let eduHtml = `<div class="section"><h2>${lang==="zh"?"教育经历":"Education"}</h2><ul>`;
    pi.edu.forEach(item=>{ eduHtml += `<li>${item.when} ${item.what}</li>`; });
    eduHtml += `</ul></div>`;

    eduHtml += `<div class="section"><h2>${lang==="zh"?"工作经历":"Work Experience"}</h2><ul>`;
    pi.work.forEach(item=>{ eduHtml += `<li>${item.when} ${item.what}</li>`; });
    eduHtml += `</ul></div>`;

    eduHtml += `<div class="section"><h2>${lang==="zh"?"学术兼职":"Academic Services"}</h2><ul>`;
    pi.society.forEach(item=>{ eduHtml += `<li>${item}</li>`; });
    eduHtml += `</ul></div>`;

    document.getElementById("tab-edu").innerHTML = eduHtml;

    // ===== 研究方向 =====
    let resHtml = `<div class="section"><h2>${lang==="zh"?"研究方向":"Research Interests"}</h2>`;
    data.research[lang].forEach(r=>{
        resHtml += `<div class="research-item"><strong>${r.title}</strong><br>${r.desc}</div>`;
    });
    resHtml += `</div>`;
    document.getElementById("tab-research").innerHTML = resHtml;

    // ===== 论文与项目 =====
    let pubHtml = `<div class="section"><h2>${lang==="zh"?"代表性论文":"Selected Publications"}</h2><ul>`;
    data.publications.highlights.forEach(p=>{
        pubHtml += `<li class="paper-item">${p}</li>`;
    });
    pubHtml += `</ul></div>`;

    pubHtml += `<div class="section"><h2>${lang==="zh"?"科研项目":"Research Projects"}</h2><ul>`;
    data.projects[lang].forEach(p=>{
        pubHtml += `<li>${p}</li>`;
    });
    pubHtml += `</ul></div>`;
    document.getElementById("tab-pub").innerHTML = pubHtml;

    // ===== 获奖成果 =====
    let awardHtml = `<div class="section"><h2>${lang==="zh"?"获奖荣誉":"Awards"}</h2><ul>`;
    data.awards[lang].forEach(a=>{
        awardHtml += `<li>${a}</li>`;
    });
    awardHtml += `</ul></div>`;

    awardHtml += `<div class="section"><h2>${lang==="zh"?"专利与著作":"Patents & Books"}</h2><ul>`;
    data.ip[lang].forEach(i=>{
        awardHtml += `<li>${i}</li>`;
    });
    awardHtml += `</ul></div>`;
    document.getElementById("tab-award").innerHTML = awardHtml;

    // ===== 招生加入 =====
    let joinHtml = `<div class="section"><h2>${lang==="zh"?"招生加入":"Join Us"}</h2><div style="font-size:15.5px">${data.join[lang]}</div></div>`;

    joinHtml += `<div class="section"><h2>${lang==="zh"?"团队成员":"Group Members"}</h2>`;
    const m = data.members;
    const hasMember = (m.postdoc && m.postdoc.length>0) || (m.phd && m.phd.length>0) || (m.master && m.master.length>0) || (m.alumni && m.alumni.length>0);

    if(m.postdoc && m.postdoc.length>0){
        joinHtml += `<h3 style="margin:12px 0 8px;color:#333">${lang==="zh"?"博士后":"Postdocs"}</h3><div class="member-block">`;
        m.postdoc.forEach(x=>{ joinHtml += `<div class="member-card"><h4>${x.name}</h4><div>${x.info}</div></div>`; });
        joinHtml += `</div>`;
    }
    if(m.phd && m.phd.length>0){
        joinHtml += `<h3 style="margin:12px 0 8px;color:#333">${lang==="zh"?"博士研究生":"PhD Students"}</h3><div class="member-block">`;
        m.phd.forEach(x=>{ joinHtml += `<div class="member-card"><h4>${x.name}</h4><div>${x.info}</div></div>`; });
        joinHtml += `</div>`;
    }
    if(m.master && m.master.length>0){
        joinHtml += `<h3 style="margin:12px 0 8px;color:#333">${lang==="zh"?"硕士研究生":"Master Students"}</h3><div class="member-block">`;
        m.master.forEach(x=>{ joinHtml += `<div class="member-card"><h4>${x.name}</h4><div>${x.info}</div></div>`; });
        joinHtml += `</div>`;
    }
    if(m.alumni && m.alumni.length>0){
        joinHtml += `<h3 style="margin:12px 0 8px;color:#333">${lang==="zh"?"毕业生":"Alumni"}</h3><div class="member-block">`;
        m.alumni.forEach(x=>{ joinHtml += `<div class="member-card"><h4>${x.name}</h4><div>${x.info}</div></div>`; });
        joinHtml += `</div>`;
    }
    if(!hasMember){
        joinHtml += `<p style="color:#666">${lang==="zh"?"成员信息持续更新中":"Members coming soon..."}</p>`;
    }
    joinHtml += `</div>`;
    document.getElementById("tab-join").innerHTML = joinHtml;
}
</script>

</body>
</html>
